coverage:
  TypeScript: full
  JavaScript: full
  Go: full
  Python: full
  REST: full
  Rust: partial
  Elixir: full
  Swift: partial
  Kotlin: partial
  Delphi: legacy

frameworks:
  OpenAPI / Orval: full
  Phoenix: full
  Phoenix LiveView: full
  Ecto: full
  Oban: full
  React: full
  Next.js: full
  Astro: full
  shadcn/ui: full
  Tailwind CSS v4: full
  Cloudflare Workers: full
  TanStack: full
  Drizzle ORM: full
  Prisma: full
  Remotion: full

files:
  - file: general.md
    description: "Shared rules for all languages: types, naming, testing, errors, imports, security, mandatory comment triggers (§25), frontend sample-data taste"
    applies_to: ["*"]
    priority: 1

  - file: architecture.md
    description: "Cross-cutting architecture rules: layers, boundaries, dependency direction, DI, events"
    applies_to: ["*"]
    priority: 2

  - file: logging.md
    description: "Structured logging, sensitive data redaction, compliance rules"
    applies_to: ["*"]
    priority: 3

  - file: testing.md
    description: "Cross-cutting testing conventions: UI test identifiers, naming, mocking, test data, async, boundaries, coverage, CLI output testing (ANSI/NO_COLOR)"
    applies_to: ["*"]
    priority: 4

  - file: javascript.md
    description: "TypeScript/Node.js/React conventions (delta on general.md)"
    applies_to: ["TypeScript", "JavaScript", "Node", "React", "Next.js"]
    priority: 5

  - file: go.md
    description: "Go-specific patterns and tooling (delta on general.md)"
    applies_to: ["Go"]
    priority: 5

  - file: rust.md
    description: "Rust idioms, ownership, error handling (delta on general.md)"
    applies_to: ["Rust"]
    priority: 5
    status: partial

  - file: delphi.md
    description: "Delphi/Pascal memory management and style (delta on general.md)"
    applies_to: ["Delphi", "Pascal"]
    priority: 5
    status: legacy

  - file: python.md
    description: "Python conventions: typing strategy, ruff/pyright tooling, Google-style docstrings, dangerous patterns (delta on general.md)"
    applies_to: ["Python"]
    priority: 5

  - file: swift-kotlin.md
    description: "iOS/Android native conventions for Swift and Kotlin (delta on general.md)"
    applies_to: ["Swift", "Kotlin"]
    priority: 5
    status: partial

  - file: database.md
    description: "SQL, schema design, migrations, query safety (language-agnostic, ORM-agnostic)"
    applies_to: ["SQL", "PostgreSQL", "MySQL", "SQLite"]
    priority: 6

  - file: runtime-configs.md
    description: "Expected config defaults per runtime/language: TypeScript files, Elixir/Mix/OTP pins, runtime/test config, editorconfig and gitignore patterns. Used by /conventions-init Phase 6."
    applies_to: ["*"]
    priority: 6

  - file: stack-commands.md
    description: "Stack detection → pre-commit commands, CI template mapping, Elixir application-specific CI and opt-in security profile matrix. Used by /conventions-init Phase 7-8."
    applies_to: ["*"]
    priority: 6

  # Framework deltas (priority 7 — loaded after language delta when framework detected)
  - file: react.md
    description: "React hooks, re-renders, composition, data fetching, motion value boundaries (delta on javascript.md)"
    applies_to: ["React"]
    priority: 7

  - file: nextjs.md
    description: "Next.js App Router, RSC, Server Components, caching, client motion leaf isolation (delta on react.md)"
    applies_to: ["Next.js"]
    priority: 7

  - file: shadcn.md
    description: "shadcn/ui composition, variants, semantic tokens, forms, no unchanged registry defaults (delta on react.md + tailwind.md)"
    applies_to: ["shadcn/ui"]
    priority: 7

  - file: tailwind.md
    description: "Tailwind CSS v4 configuration, theming, utilities, marketing layout guardrails (delta on javascript.md)"
    applies_to: ["Tailwind CSS"]
    priority: 7

  - file: cloudflare.md
    description: "Cloudflare Workers, D1, R2, KV, Hono, scheduled jobs and durable execution patterns (delta on javascript.md)"
    applies_to: ["Cloudflare Workers", "Hono"]
    priority: 7

  - file: tanstack.md
    description: "TanStack Query v5, Router, Start conventions (delta on react.md)"
    applies_to: ["TanStack Query", "TanStack Router", "TanStack Start"]
    priority: 7

  - file: drizzle.md
    description: "Drizzle ORM schema, migrations, queries, D1/PostgreSQL (delta on database.md)"
    applies_to: ["Drizzle ORM"]
    priority: 7

  - file: prisma.md
    description: "Prisma v7 schema, client, transactions, migrations (delta on database.md)"
    applies_to: ["Prisma"]
    priority: 7

  - file: astro.md
    description: "Astro islands, client directives, content collections, routing, rendering modes (delta on javascript.md)"
    applies_to: ["Astro"]
    priority: 7

  - file: remotion.md
    description: "Remotion compositions, animations, sequencing, assets, rendering (delta on react.md)"
    applies_to: ["Remotion"]
    priority: 7

  - file: cli.md
    description: "TypeScript/Node.js CLI application conventions: entry point fast-path, Commander.js, module structure, esbuild build pipeline, feature gates, startup optimization, error handling, Ink/React TUI (delta on javascript.md)"
    applies_to: ["TypeScript", "Node.js", "Bun", "CLI"]
    priority: 7
    use_when: ["building a CLI", "Node.js CLI", "TypeScript CLI", "Commander.js", "Ink TUI", "terminal application", "bun build --compile", "stdin input", "pipe input"]
    questions_answered:
      - "How to structure a TypeScript CLI project?"
      - "How to make CLI startup fast?"
      - "How to use Commander.js?"
      - "When to use Ink vs chalk+ora?"
      - "How to handle errors in a CLI?"
      - "How to build a CLI with esbuild?"
      - "How to add --json output to a command?"
      - "How to accept stdin in a CLI command?"
      - "How to pipe input to a CLI?"
    see_also:
      - "../design/systems/cli-patterns.md"
      - "../stack-ref/frontend/cli.md"
      - "javascript.md"

  - file: ../conventions/diagrams.md
    description: "Diagram conventions (transversal — also loaded outside code context). See conventions/"

  - file: elixir.md
    description: "Elixir idioms, Mix/Hex toolchain, typespecs, documentation, module attributes, runtime configuration, i18n and HTTP adapters"
    applies_to: ["Elixir", "Mix", "Hex"]
    priority: 5
    status: complete
    use_when: ["writing Elixir modules", "documenting Elixir code", "module attributes and runtime config", "Gettext Localize money dates"]
    questions_answered: ["How should Elixir code, specs and comments be written?", "Which configuration belongs at compile time or runtime?"]
    see_also: ["elixir-otp.md", "elixir-testing.md"]

  - file: elixir-otp.md
    description: "BEAM/OTP supervision, bounded tasks, backpressure, ETS/Cachex memory, profiling and Rustler NIF versus isolated Rust services"
    applies_to: ["Elixir", "Erlang/OTP", "BEAM", "Rustler"]
    priority: 6
    status: complete
    use_when: ["choosing GenServer or Task.Supervisor", "bounding BEAM memory and concurrency", "isolating native Rust work"]
    questions_answered: ["When does a GenServer help?", "How do NIF scheduling and VM crash risks differ from a service?"]
    see_also: ["rust.md", "oban.md"]

  - file: phoenix.md
    description: "Phoenix contexts, Router/Plug, React/mobile API contracts, auth scopes and tenants, Channels/PubSub and public CDN boundaries"
    applies_to: ["Phoenix"]
    priority: 7
    status: complete
    use_when: ["building Phoenix APIs for React or mobile", "authorizing Phoenix tenant operations", "choosing Channels or durable jobs"]
    questions_answered: ["How should Phoenix web code call contexts?", "Which state may a CDN or PubSub safely own?"]
    see_also: ["phoenix-liveview.md", "ecto.md", "oban.md"]

  - file: phoenix-liveview.md
    description: "LiveView choice, lifecycle, mount and event security, bounded assigns/streams, async work, reconnect and browser test boundaries"
    applies_to: ["Phoenix LiveView"]
    priority: 8
    status: complete
    use_when: ["building interactive LiveView screens", "securing LiveView events", "testing reconnect and async assigns"]
    questions_answered: ["When should LiveView be chosen over React or native UI?", "How should mount, streams and durable state behave?"]
    see_also: ["phoenix.md", "elixir-testing.md"]

  - file: ecto.md
    description: "Ecto/Postgrex changesets, scoped queries, database constraints, booking concurrency, Multi transactions and safe PostgreSQL migrations"
    applies_to: ["Ecto", "Postgrex"]
    priority: 7
    status: complete
    use_when: ["validating and persisting Ecto data", "preventing double bookings in PostgreSQL", "deploying Ecto migrations safely"]
    questions_answered: ["How do changesets map database constraint failures?", "How should real independent transaction contention be tested?"]
    see_also: ["database.md", "oban.md", "elixir-testing.md"]

  - file: oban.md
    description: "Durable Oban jobs, atomic data and job insertion, retries and provider reconciliation, per-node limits and active Flycast execution"
    applies_to: ["Oban"]
    priority: 8
    status: complete
    use_when: ["scheduling durable Elixir jobs", "making provider side effects idempotent", "running Oban workers on Fly.io"]
    questions_answered: ["Does inserting an Oban job wake a suspended worker?", "How do queue limits and external reconciliation work?"]
    see_also: ["ecto.md", "elixir-otp.md", "elixir-testing.md"]

  - file: elixir-testing.md
    description: "ExUnit, doctests, ConnTest/LiveViewTest, SQL Sandbox and real concurrency, Oban.Testing, HTTP mocks, Mix/Cargo checks and isolated PostgreSQL CI"
    applies_to: ["Elixir", "ExUnit", "Phoenix", "Oban", "Rustler"]
    priority: 9
    status: complete
    use_when: ["running Elixir checks and CI", "testing sandbox process ownership", "testing retry crash and reconnect recovery"]
    questions_answered: ["Which Mix commands are required and which tools are optional?", "How should PostgreSQL CI and actual concurrency tests be isolated?"]
    see_also: ["testing.md", "runtime-configs.md", "stack-commands.md"]

  - file: openapi.md
    description: "REST/OpenAPI contract ownership, Phoenix/OpenApiSpex generation and validation, reproducible Orval TypeScript SDK, runtime/consumer coherence gates and mobile compatibility"
    applies_to: ["REST", "OpenAPI", "OpenApiSpex", "Orval", "Phoenix", "TypeScript"]
    priority: 8
    status: complete
    use_when: ["generating Phoenix REST APIs and TypeScript SDKs", "validating API and SDK coherence", "detecting breaking HTTP changes", "exporting OpenApiSpex contracts", "Orval codegen"]
    questions_answered:
      - "How do Phoenix routes, OpenApiSpex schemas and Orval clients stay consistent?"
      - "Which plugs validate requests and how are real responses tested?"
      - "How should API export, SDK regeneration and older mobile compatibility be checked in CI?"
    see_also: ["phoenix.md", "elixir-testing.md", "javascript.md", "tanstack.md"]
