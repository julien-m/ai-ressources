sections:
  tokens:
    description: "Design token scales for spacing, typography, colors, motion, and cross-platform unit mapping"
    files:
      - file: tokens/spacing.md
        description: "8px grid, semantic spacing scale, platform unit mapping"
      - file: tokens/typography.md
        description: "Type scale, font stacks, line-height/tracking per platform"
      - file: tokens/colors.md
        description: "Color tokens: semantic palette, dark mode, contrast rules"
      - file: tokens/motion.md
        description: "Motion tokens: duration scale, easing functions, transition types, reduced motion, cross-platform"
      - file: tokens/cross-platform.md
        description: "Cross-platform design: unit mapping (px/pt/dp/sp), shared patterns"

  systems:
    description: "Platform-specific design system quick references"
    files:
      - file: systems/apple-hig.md
        description: "Apple Human Interface Guidelines: iOS/macOS patterns, SF Symbols, navigation"
      - file: systems/material-design.md
        description: "Material Design 3: Android patterns, dynamic color, components"
      - file: systems/web-standards.md
        description: "Web standards: responsive patterns, accessibility, CSS best practices"
      - file: systems/design-system-selection.md
        description: "Design system selection: official packages, honest aesthetic implementations, dependency checks"
      - file: systems/cli-patterns.md
        description: "CLI design system: colors ANSI, typographie terminal, composants (spinner, progress, prompts, tables), TUI frameworks, layout, error handling"

  components:
    description: "Cross-platform component specs with per-platform guidelines"
    files:
      - file: components/dashboard-design.md
        description: "Decision-first dashboards: data contracts, freshness, partial states, summaries and drill-down"
        use_when: ["dashboard", "cockpit", "KPI", "analytics"]
      - file: components/onboarding-design.md
        description: "Purposeful onboarding: first value, questions, permissions, resumability and activation"
        use_when: ["onboarding", "activation", "personalization", "permissions"]
      - file: components/paywall-design.md
        description: "Transparent paywalls: offers, trials, pricing disclosure, access reconciliation and recovery"
        use_when: ["paywall", "upgrade", "subscription", "free trial"]
      - file: components/streak-design.md
        description: "Meaningful streaks: qualifying events, timezones, pauses, reminders and recovery"
        use_when: ["streak", "habit", "gamification", "progress"]
      - file: components/forms.md
        description: "Form patterns: validation, layout, input types, error states"
        use_when: ["form design", "input validation UX", "form layout", "error states"]
        questions_answered: ["How to layout a form?", "Inline vs summary validation?", "Which input types?"]
        see_also: ["../quality/ui-rules.md", "../tokens/spacing.md"]
      - file: components/lists.md
        description: "List patterns: virtualization, pull-to-refresh, swipe actions"
        use_when: ["list UI", "infinite scroll", "pull-to-refresh", "swipe actions", "virtualization"]
        questions_answered: ["When to virtualize?", "Pull-to-refresh pattern?", "Swipe action conventions?"]
        see_also: ["../quality/ui-rules.md"]
      - file: components/modals.md
        description: "Modals and dialogs: sheets, alerts, confirmation patterns"
        use_when: ["modal design", "dialog", "bottom sheet", "alert", "confirmation flow"]
        questions_answered: ["Modal vs sheet vs alert?", "Confirmation dialog pattern?", "Nested modals?"]
        see_also: ["../quality/accessibility.md"]
      - file: components/payment-flows.md
        description: "Payment UX patterns: tip/donation, subscription, one-time, express checkout, error handling"
        use_when: ["payment UI", "checkout flow", "tip/donation UX", "subscription billing UI"]
        questions_answered: ["Checkout flow best practices?", "How to handle payment errors?", "Express checkout?"]
        see_also: ["../../stack-ref/payments/", "../../legal/cgv-saas.md", "../../pricing-models/"]
      - file: components/log-viewer.md
        description: "Log viewer patterns: terminal streaming, web table layout, filtering, JSON expand, multi-service"
        use_when: ["log viewer", "terminal UI", "log streaming", "JSON viewer", "devtools UI"]
        questions_answered: ["How to build a log viewer?", "Auto-scroll behavior?", "Log filtering patterns?"]
        see_also: ["../references/devtools.md", "realtime-streams.md"]
      - file: components/data-visualization.md
        description: "Data visualization patterns: metric cards, sparklines, charts (line/bar/area/pie), dashboard layout, number formatting"
        use_when: ["dashboard", "charts", "metrics display", "data visualization", "sparklines"]
        questions_answered: ["Which chart type?", "Dashboard layout patterns?", "Number formatting conventions?"]
        see_also: ["../references/devtools.md", "../references/app-ui.md"]
      - file: components/realtime-streams.md
        description: "Real-time streaming UI: WebSocket/SSE, reconnection, buffering, auto-scroll, optimistic updates, token streaming"
        use_when: ["real-time UI", "WebSocket", "SSE", "live updates", "chat UI", "AI token streaming"]
        questions_answered: ["WebSocket vs SSE?", "Reconnection strategy?", "Optimistic updates?", "Token streaming UI?"]
        see_also: ["log-viewer.md", "../../architecture/event-driven.md"]
      - file: components/data-visualization-terminal.md
        description: "Data visualization for terminal interfaces: ASCII sparklines, histograms, status bars (extracted from data-visualization.md)"
        use_when: ["terminal data viz", "ASCII chart", "CLI dashboard", "terminal sparkline", "ANSI data viz"]
        questions_answered: ["ASCII sparkline pattern?", "Terminal histogram?", "CLI status bar?"]
        see_also: ["data-visualization.md"]
      - file: components/realtime-streams-terminal.md
        description: "Real-time streaming patterns for terminal interfaces: ANSI cursor control, CLI buffering (extracted from realtime-streams.md)"
        use_when: ["terminal streaming", "ANSI realtime", "CLI live output", "tail -f pattern", "terminal buffering"]
        questions_answered: ["Terminal streaming pattern?", "ANSI cursor streaming?"]
        see_also: ["realtime-streams.md"]
      - file: components/email-templates.md
        description: "Email template patterns: responsive layout, dark mode, client quirks, components"
        use_when: ["email design", "transactional email", "email template", "dark mode email"]
        questions_answered: ["Email client compatibility?", "Responsive email layout?", "Dark mode support?"]
        see_also: ["../../copywriting/email-sequences.md", "../../stack-ref/email/"]
      - file: components/buttons.md
        description: "Button patterns: variants, sizes, states, icons, loading, groups, accessibility"
        use_when: ["button design", "CTA button", "button states", "button group", "icon button"]
        questions_answered: ["Button variant hierarchy?", "Loading state pattern?", "Icon button accessibility?"]
        see_also: ["forms.md", "../quality/accessibility.md"]
      - file: components/feedback.md
        description: "Feedback patterns: toasts, alerts, banners, progress indicators, empty states, skeleton loading"
        use_when: ["toast notification", "alert banner", "empty state", "skeleton loading", "progress indicator"]
        questions_answered: ["Toast vs alert vs banner?", "Empty state design?", "Skeleton loading pattern?"]
        see_also: ["../quality/ui-rules.md", "../quality/accessibility.md"]
      - file: components/navigation.md
        description: "Navigation patterns: tabs, breadcrumbs, sidebars, menus, mobile bottom nav, command palette"
        use_when: ["navigation design", "sidebar", "tabs", "breadcrumbs", "mobile nav", "command palette"]
        questions_answered: ["Sidebar vs top nav?", "Mobile navigation pattern?", "Command palette implementation?"]
        see_also: ["../references/app-ui.md", "../quality/accessibility.md"]

  references:
    description: "Market design references: per-company design systems, landing page conventions, app UI patterns (based on 2026 market analysis)"
    last_reviewed: "2026-10-18"
    files:
      - file: references/mobbin-blog-review.md
        description: "Article-by-article review of 14 Mobbin blog posts with source limits and reusable local recommendations"
        use_when: ["Mobbin", "blog review", "UX research"]
      - file: references/ui-reference-research.md
        description: "UI reference research: source provenance, benchmark selection, MCP limits and implementable contracts"
        use_when: ["UI benchmark", "MCP design", "reference research"]
      - file: references/homepage-evidence.md
        description: "Homepage evidence: truthful claims, testimonial provenance, bento composition and accessible motion"
        use_when: ["homepage", "testimonial", "bento", "marketing proof"]
      - file: references/landing-pages.md
        description: "Landing page conventions by product type: devtools, B2B SaaS, fintech, consumer, creators, health, AI, e-commerce"
        use_when: ["landing page design", "marketing site", "product page layout", "hero section"]
        questions_answered: ["Landing page conventions by industry?", "Hero section patterns?", "Social proof placement?"]
        see_also: ["../../copywriting/landing-page.md", "../../seo/core-web-vitals.md"]
      - file: references/design-read-protocol.md
        description: "Design read protocol: infer page kind, audience, vibe, dials, and aesthetic/system direction before design work"
        use_when: ["design read", "brief interpretation", "landing page design", "portfolio design", "redesign"]
        questions_answered: ["How should the brief be read?", "Which audience and vibe apply?", "When should I ask a design clarification?"]
        see_also: ["../systems/design-system-selection.md", "../quality/design-taste.md"]
      - file: references/redesign-protocol.md
        description: "Redesign protocol: preserve vs evolve vs overhaul, audit before touching, preservation rules"
        use_when: ["redesign", "site refresh", "visual overhaul", "preserve brand"]
        questions_answered: ["What should a redesign preserve?", "When is a full redesign justified?", "What should be audited first?"]
        see_also: ["design-read-protocol.md", "../quality/design-taste.md"]
      - file: references/app-ui.md
        description: "App UI conventions: universal SaaS patterns, layout, components, views by category"
        use_when: ["SaaS app design", "dashboard layout", "app shell", "sidebar layout"]
        questions_answered: ["Standard SaaS layout?", "Dashboard design patterns?", "App shell structure?"]
        see_also: ["app-views.md", "devtools.md", "../components/navigation.md"]
      - file: references/design-references.md
        description: "Per-company design system references: Vercel, Linear, Stripe, Clerk, etc."
        use_when: ["design inspiration", "design system reference", "company design benchmarks"]
        questions_answered: ["How does Stripe/Linear/Vercel design their UI?", "Design system benchmarks?"]
        see_also: ["app-ui.md", "landing-pages.md"]
      - file: references/app-views.md
        description: "Standard SaaS views catalog: dashboard, settings, user management, auth, activity log"
        use_when: ["settings page", "user management UI", "activity log", "auth pages", "standard SaaS views"]
        questions_answered: ["What views does a SaaS need?", "Settings page structure?", "Activity log design?"]
        see_also: ["app-ui.md", "../components/forms.md", "../components/lists.md"]
      - file: references/devtools.md
        description: "DevTools UI conventions: monitoring dashboards, log viewers, deployment pipelines"
        use_when: ["devtools UI", "monitoring dashboard", "deployment UI", "container management"]
        questions_answered: ["DevTools dashboard patterns?", "Log viewer layout?", "Deployment pipeline UI?"]
        see_also: ["app-ui.md", "../components/log-viewer.md", "../components/data-visualization.md"]
      - file: references/mockup-specs.md
        description: "Mockup maquettage reference: explicit px values for component heights, paddings, icon sizes"
        use_when: ["mockup", "maquettage", "wireframe", "pixel specs", "component dimensions"]
        questions_answered: ["Standard component heights?", "Padding values?", "Modal dimensions?", "Mobile screen sizes?"]
        see_also: ["../tokens/spacing.md", "../tokens/typography.md"]
      - file: references/component-blocks-catalog.md
        description: "UI blocks taxonomy and template patterns: marketing section types, application block types (dashboard, data, auth, nav, settings, content, commerce, integration), page compositions by product type, universal ordering rules"
        use_when: ["page composition", "landing page sections", "block types", "template pattern", "section ordering", "what sections to include", "app blocks", "dashboard blocks", "CRUD table", "auth flow blocks"]
        questions_answered: ["Which sections for a SaaS landing?", "What block types exist?", "Section ordering rules?", "Primitives vs blocks?", "What app blocks exist?", "Dashboard block anatomy?", "Auth flow blocks?"]
        see_also: ["landing-pages.md", "app-ui.md", "app-views.md"]
      - file: references/app-views-catalog.md
        description: "App views catalog: view compositions from blocks, app template patterns (SaaS B2B, Creator, AI Chat, DevTool, CRM, E-commerce, Mobile, Project Tracker, Internal Tool/Admin Panel), composable traits (Auth, Billing, Team, API, Notifications, Integrations, Audit), views (Chat View, Billing Upgrade Flow, Board, Calendar, Notifications Inbox, Settings Integrations, Media Library)"
        use_when: ["app template", "which views for an app", "view composition", "SaaS app structure", "app pattern shorthand", "composable traits", "project tracker", "kanban board", "issue tracker", "internal tool", "admin panel", "chat view", "billing upgrade"]
        questions_answered: ["Which views does a SaaS B2B need?", "What blocks go in a Dashboard view?", "How to describe an app with one line?", "What does Auth/Billing/Team trait add?", "What does Notifications/Integrations/Audit trait add?", "How to build a project tracker app?", "How to build an internal admin tool?", "What is a Chat View?"]
        see_also: ["component-blocks-catalog.md", "app-views.md", "app-ui.md"]

  quality:
    description: "Visual QA and non-regression rules"
    files:
      - file: quality/ui-rules.md
        description: "UI visual non-regression rules: alignment, spacing, overflow checks"
      - file: quality/accessibility.md
        description: "Accessibility patterns: WCAG 2.2 AA, ARIA, keyboard nav, focus management, screen readers"
      - file: quality/design-taste.md
        description: "Design taste QA: anti-default rules, AI tell ban, hero/nav/CTA/bento pre-flight checks"

sub_domains:
  design-tokens:
    label: "Design tokens — colors, spacing, typography, motion"
    keywords: [CSS, colors, couleurs, spacing, typography, typo, motion, gradients, shadows, "CSS variables", border-radius, palette, "dark mode", "color scale"]
    sources:
      - tokens/colors.md
      - tokens/spacing.md
      - tokens/typography.md
      - tokens/motion.md
    exclude_columns: ["iOS (pt)", "Android (dp)", "Native (sp)"]

  design-components:
    label: "UI components — buttons, inputs, forms, modals, nav, toasts, lists"
    keywords: [button, input, form, toast, badge, modal, nav, sidebar, dropdown, avatar, list, feedback, alert, banner, skeleton, "empty state", navigation, breadcrumb, tabs, "icon button", "button group"]
    sources:
      - references/app-ui.md
      - components/buttons.md
      - components/forms.md
      - components/feedback.md
      - components/navigation.md
      - components/modals.md
      - components/lists.md

  design-views:
    label: "Pages & layouts — SaaS views, dashboard, settings, auth, mockup specs"
    keywords: [page, vue, layout, dashboard, settings, auth, SaaS, mockup, wireframe, "landing page", "app shell", "sidebar layout", "standard views", "view composition", "settings page", "activity log", "user management"]
    sources:
      - references/app-views.md
      - references/app-views-catalog.md
      - references/design-read-protocol.md
      - references/redesign-protocol.md
      - references/mockup-specs.md
      - systems/web-standards.md

  design-quality:
    label: "Quality & accessibility — a11y, WCAG, audit, UI rules, non-regression"
    keywords: [accessibilité, a11y, WCAG, audit, "keyboard nav", "screen reader", focus, ARIA, contrast, "color blind", "reduced motion", "non-regression", overflow, alignment, "visual QA"]
    sources:
      - quality/accessibility.md
      - quality/ui-rules.md
      - quality/design-taste.md

  design-dataviz:
    label: "Data visualization — charts, metrics, KPIs, dashboard, sparklines"
    keywords: [chart, graphe, metrics, dashboard, sparkline, KPI, "line chart", "bar chart", "area chart", histogram, "pie chart", "donut chart", "number formatting", "metric card", recharts, d3, tremor]
    sources:
      - components/dashboard-design.md
      - components/data-visualization.md

  design-realtime:
    label: "Real-time UI — WebSocket, SSE, streaming LLM, token streaming"
    keywords: [WebSocket, SSE, "real-time", "temps réel", streaming, LLM, "token streaming", reconnect, "optimistic updates", "live updates", "chat UI", buffering, "socket.io", ably, pusher]
    sources:
      - components/realtime-streams.md

  design-onboarding:
    label: "Onboarding — first value, personalization, permissions, resumption"
    keywords: [onboarding, activation, personalization, "first run", "premiere utilisation", "permission prompt"]
    sources:
      - components/onboarding-design.md
      - components/forms.md
      - quality/accessibility.md

  design-monetization:
    label: "Monetization — paywalls, upgrades, subscriptions, trials"
    keywords: [paywall, upgrade, subscription, abonnement, "free trial", essai, "plan selection"]
    sources:
      - components/paywall-design.md
      - components/payment-flows.md
      - quality/accessibility.md

  design-engagement:
    label: "Engagement — meaningful goals, streaks, pauses, reminders"
    keywords: [streak, habit, gamification, habitude, "daily goal", "streak freeze"]
    sources:
      - components/streak-design.md
      - components/feedback.md
      - quality/accessibility.md

  design-research:
    label: "UI research — references, benchmarks, provenance, MCP"
    keywords: [Mobbin, "UI benchmark", "MCP design", "reference research", "UX research", "blog review"]
    sources:
      - references/ui-reference-research.md
      - references/mobbin-blog-review.md
      - references/design-read-protocol.md

  design-marketing:
    label: "Marketing design — homepage evidence, testimonials, bento composition"
    keywords: [homepage, bento, testimonial, temoignage, "marketing proof", "hero evidence"]
