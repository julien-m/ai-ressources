# JSON Schema for the root index.yaml
# Validates the top-level knowledge base manifest
# Format: https://json-schema.org/draft/2020-12
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/julien-m/ai-ressources/schemas/root-index.schema.yaml"
title: Root Index
description: Schema for the root index.yaml that lists all knowledge domains.

type: object
required: [domains]
additionalProperties: false

properties:
  domains:
    type: object
    description: Map of domain names to their metadata.
    minProperties: 1
    additionalProperties:
      type: object
      required: [description, status, file_count]
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          description: Human-readable description of the domain's content.
        status:
          type: string
          enum: [complete, active, partial, placeholder]
          description: "Completeness of the domain: complete (stable), active (being updated), partial (incomplete), placeholder (empty)."
        file_count:
          type: integer
          minimum: 0
          description: Number of content files in this domain (excluding index.yaml).
        last_reviewed:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Date (YYYY-MM-DD) when this domain was last reviewed or touched.
        subdirectories:
          type: array
          description: List of subdirectory names when the domain has nested folders.
          items:
            type: string
            minLength: 1
