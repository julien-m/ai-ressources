# @generated by conventions-init — do not edit manually
# Generated by conventions-init — re-run to regenerate after upgrading ai-ressources.
# NOTE: cargo fmt and cargo clippy operate at the crate level — per-file mode is not supported.
# Full codebase checks always run (pre-existing issues will block CI).
# To downgrade clippy to advisory: remove '-- -D warnings' from the clippy step.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build
        run: cargo build --all-targets
