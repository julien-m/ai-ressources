name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for changed-files action

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get changed JS/TS files
        id: changed-src
        uses: tj-actions/changed-files@v45
        with:
          separator: "\n"
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx

      - name: Get changed linter config files
        id: changed-cfg
        uses: tj-actions/changed-files@v45
        with:
          files: |
            biome.json
            biome.jsonc
            .eslintrc
            .eslintrc.js
            .eslintrc.cjs
            .eslintrc.json
            .eslintrc.yaml
            .eslintrc.yml
            eslint.config.js
            eslint.config.mjs
            eslint.config.cjs
            tsconfig.json
            tsconfig.*.json
            .prettierrc
            .prettierrc.js
            .prettierrc.json
            .prettierrc.yaml
            .prettierrc.yml
            prettier.config.js

      - name: Format check
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          HAS_BIOME=false
          HAS_PRETTIER=false
          if [ -f biome.json ] || [ -f biome.jsonc ]; then
            HAS_BIOME=true
          fi
          if [ -f .prettierrc ] || [ -f .prettierrc.js ] || [ -f .prettierrc.json ] || \
             [ -f .prettierrc.yaml ] || [ -f .prettierrc.yml ] || [ -f prettier.config.js ]; then
            HAS_PRETTIER=true
          fi
          if [ "$HAS_BIOME" = "true" ]; then
            if [ "$CFG_CHANGED" = "true" ]; then
              npx biome format --check .
            elif [ -n "$SRC_FILES" ]; then
              mapfile -t files <<< "$SRC_FILES"
              npx biome format --check "${files[@]}"
            else
              echo "No JS/TS changes, skipping format check."
            fi
          elif [ "$HAS_PRETTIER" = "true" ]; then
            if [ "$CFG_CHANGED" = "true" ]; then
              npx prettier --check .
            elif [ -n "$SRC_FILES" ]; then
              mapfile -t files <<< "$SRC_FILES"
              npx prettier --check "${files[@]}"
            else
              echo "No JS/TS changes, skipping format check."
            fi
          else
            echo "No formatter configured — skipping format check"
          fi

      - name: Lint
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          HAS_BIOME=false
          HAS_ESLINT=false
          if [ -f biome.json ] || [ -f biome.jsonc ]; then
            HAS_BIOME=true
          fi
          if [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || \
             [ -f .eslintrc.json ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || \
             [ -f eslint.config.cjs ]; then
            HAS_ESLINT=true
          fi
          if [ "$HAS_BIOME" = "true" ]; then
            if [ "$CFG_CHANGED" = "true" ]; then
              npx biome check .
            elif [ -n "$SRC_FILES" ]; then
              mapfile -t files <<< "$SRC_FILES"
              npx biome check "${files[@]}"
            else
              echo "No JS/TS changes, skipping lint."
            fi
          elif [ "$HAS_ESLINT" = "true" ]; then
            if [ "$CFG_CHANGED" = "true" ]; then
              npx eslint .
            elif [ -n "$SRC_FILES" ]; then
              mapfile -t files <<< "$SRC_FILES"
              npx eslint "${files[@]}"
            else
              echo "No JS/TS changes, skipping lint."
            fi
          else
            echo "No linter configured — skipping lint"
          fi

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
