# @generated by conventions-init - do not edit manually
name: Security Production Web JS TS

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  sast_sca:
    name: SAST and dependency scans
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep
        run: |
          semgrep --config p/owasp-top-ten --config p/javascript --config p/typescript \
            --json --output semgrep.json || true

      - name: Run package audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --json > npm-audit.json || true
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm audit --json > pnpm-audit.json || true
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn npm audit --json > yarn-audit.json || true
          else
            echo "No supported JS/TS lockfile found." > dependency-audit.txt
          fi

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload PR scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-security-reports
          path: |
            semgrep.json
            trivy.json
            *-audit.json
            dependency-audit.txt

  dast:
    name: Staging DAST
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ secrets.STAGING_URL }}
    steps:
      - name: Validate staging URL
        run: test -n "$TARGET_URL" || (echo "Missing STAGING_URL secret" && exit 1)

      - name: Run Nuclei
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" projectdiscovery/nuclei:latest \
            -u "$TARGET_URL" \
            -severity critical,high,medium \
            -jsonl \
            -o /workspace/nuclei.json || true

      - name: Run ZAP Baseline
        run: |
          docker run --rm -v "${{ github.workspace }}:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET_URL" -J zap.json -r zap.html || true

      - name: Upload DAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dast-security-reports
          path: |
            nuclei.json
            zap.json
            zap.html
