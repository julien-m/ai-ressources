# @generated by conventions-init - do not edit manually
name: Security Production JS TS

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  sast_sca:
    name: SAST and dependency scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep
        run: |
          semgrep --config p/owasp-top-ten --config p/javascript --config p/typescript \
            --json --output semgrep.json || true

      - name: Run package audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --json > npm-audit.json || true
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm audit --json > pnpm-audit.json || true
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn npm audit --json > yarn-audit.json || true
          else
            echo "No supported JS/TS lockfile found." > dependency-audit.txt
          fi

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-security-reports
          path: |
            semgrep.json
            trivy.json
            *-audit.json
            dependency-audit.txt
